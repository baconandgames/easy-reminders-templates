[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "listkit"
version = "0.6.1"
description = "Easy templates for Apple Reminders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"certifi>=2024.2.2",
	"questionary==2.1.1",
	"textual>=8.2.8",
]

[project.scripts]
listkit = "listkit.cli:main"

[tool.setuptools]
packages = ["listkit"]

[tool.setuptools.package-data]
listkit = [
	"default_templates/recipes/*.json",
	"default_templates/lists/*.json",
	"bin/reminders-helper.swift",
]
