[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-reminder-templates"
version = "0.4.10"
description = "Create Apple Reminders items from reusable list templates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"certifi>=2024.2.2",
	"questionary==2.1.1",
	"textual>=8.2.8",
]

[project.scripts]
listkit = "recipe_shopper.cli:main"

[tool.setuptools]
packages = ["recipe_shopper"]

[tool.setuptools.package-data]
recipe_shopper = [
	"default_templates/recipes/*.json",
	"default_templates/lists/*.json",
	"bin/reminders-helper.swift",
]
